        hard: 65536
        soft: 65536
    volumes:
      - /opt/docker/rabbitmq/data-2:/var/lib/rabbitmq
      - /opt/docker/rabbitmq/etc/defaults.conf:/etc/rabbitmq/conf.d/10-defaults.conf:ro
      - /opt/docker/rabbitmq/etc/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
  rabbitmq-3:
